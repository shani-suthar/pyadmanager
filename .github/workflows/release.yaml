name: Release to PyPI
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/code-quality.yaml
  version_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify tag matches pyproject.toml version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi
          echo "Tag version $TAG_VERSION matches pyproject.toml"
  publish:
    needs: [quality, version_check]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyadmanager
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
