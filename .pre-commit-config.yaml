repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.3
    hooks:
      # Update the uv lockfile
      - id: uv-lock
  
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.2
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [ python, pyi, pyproject ]
        args: [ --fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]
  
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
    - id: pyright

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false